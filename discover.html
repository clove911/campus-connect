
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover Students | Campus Connect</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/discover.css">
</head>
<body>

    <aside class="app-sidebar">
    <div class="nav-logo">Campus Connect</div>

    <nav class="nav-links">

        <a href="dashboard.html" class="nav-item">
            <span class="nav-icon">⌂</span>
            <span>Home</span>
        </a>

        <a href="discover.html" class="nav-item active">
            <span class="nav-icon">⌕</span>
            <span>Discover</span>
        </a>

        <a href="profile.html" class="nav-item">
            <span class="nav-icon">♙</span>
            <span>My Profile</span>
        </a>

        <a href="connections.html" class="nav-item">
            <span class="nav-icon">♡</span>
            <span>Connections</span>
        </a>

        <a href="messages.html" class="nav-item">
            <span class="nav-icon">✉</span>
            <span>Messages</span>
        </a>

    </nav>
</aside>
    
    <main class="discover-container">

        <a href="dashboard.html" class="back-link">
            ← Back to dashboard
        </a>

        <section class="discover-header">
            <p class="eyebrow">YOUR STUDY COMMUNITY</p>
            <h1>Find your people.</h1>
            <p>Discover students who share your subjects and learning style.</p>
        </section>

        <section class="search-section">
            <div class="search-box">
                <span>⌕</span>
                <input
                    type="search"
                    id="studentSearch"
                    placeholder="Search students by name..."
                    autocomplete="off"
                    maxlength="30"
                >
            </div>

            <p id="searchMessage" aria-live="polite">
                Start typing to discover students.
            </p>

            <div id="searchResults" class="search-results"></div>
        </section>

    </main>

    <script type="module" src="js/discover.js"></script>
</body>
</html>
